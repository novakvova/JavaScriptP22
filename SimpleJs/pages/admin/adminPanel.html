<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="/css/style.css" rel="stylesheet" />
    <title></title>
</head>
<body>
    <script src="/js/site.js"></script>
    <script>loadDOM('/partials/header.html');</script>
    <script>loadDOM('/partials/asideAdminPanel.html');</script>

    <div id="addItemPage" style="margin:20px 50px 0 300px">

        <div class="relative overflow-x-auto shadow-md sm:rounded-lg">


            <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                    <tr>
                        <th scope="col" class="px-16 py-3">
                            <span class="sr-only">Фото</span>
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Нзва
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Slug
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Пріорітет
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody id="listCategories">
                    <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <td class="p-4">
                            <img src="https://flowbite.com/docs/images/products/apple-watch.png" class="w-16 md:w-32 max-w-full max-h-full" alt="Apple Watch">
                        </td>
                        <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                            Apple Watch
                        </td>
                        <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                            sdfasfasf
                        </td>

                        <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                            1
                        </td>
                        <td class="px-6 py-4">
                            <a href="#" class="font-medium text-red-600 dark:text-red-500 hover:underline">Remove</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav aria-label="Page navigation example" class="my-4 flex justify-center">
            <ul class="inline-flex -space-x-px text-base h-10" id="pagination">
            </ul>
        </nav>

    </div>

    <script>
        async function fetchCategories() {
            try {
                //const response = await axios.get('https://goose.itstep.click/api/Categories/list', {
                //    headers: {
                //        'Accept': '*/*'
                //    }
                //});



                const response = await axios.get('https://goose.itstep.click/api/Categories/search', {
                    headers: {
                        'Accept': '*/*'
                    }
                });

                const { data } = response;
                console.log("server result", data);
                const { categories, pages, total, currentPage } = data;

                loadPagination(pages);
                const listCategories = document.getElementById("listCategories");
                listCategories.innerHTML = "";
                categories.forEach(item => {
                    //console.log("item", item);
                    listCategories.innerHTML += `
                            <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
                                <td class="p-4">
                                    <img src="https://goose.itstep.click/images/200_${item.image}" class="" alt="Apple Watch">
                                </td>
                                <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                                    ${item.title}
                                </td>
                                <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                                    ${item.urlSlug}
                                </td>
                            
                                <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                                    ${item.priority}
                                </td>
                                <td class="px-6 py-4">
                                    <a href="${item.id}" class="font-medium text-red-600 dark:text-red-500 hover:underline">Remove</a>
                                </td>
                            </tr>
                    `;
                });
                //console.log("Server Result", data);
            } catch (error) {
                console.error('Error fetching categories:', error);
            }
        }

        fetchCategories();

        function loadPagination(pages) {
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = `
                <li>
                        <a href="#" class="flex items-center justify-center px-4 h-10 ms-0 leading-tight text-gray-500 bg-white border border-e-0 border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">Previous</a>
                </li>
                `;

            for(let i = 1; i <= pages; i++) {
                pagination.innerHTML += `
                <li>
                    <a href="#" class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">${i}</a>
                </li>
                    `;
            }

            pagination.innerHTML += `
                <li>
                    <a href="#" class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">Next</a>
                </li>
                    `;
        }

    </script>
</body>
</html>
