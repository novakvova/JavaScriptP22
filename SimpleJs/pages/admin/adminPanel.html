<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.14.0/qs.min.js" integrity="sha512-6yLIYbXqyvjSDYNO1pgBRjwWPBw66kMOb+sHqrvn457+iJiret0PeHzUlpLKHH0fYzX9bxGtPDqQ84xKrhEYSQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="/css/style.css" rel="stylesheet" />
    <title></title>
</head>
<body>
    <script src="/js/site.js"></script>
    <script>loadDOM('/partials/header.html');</script>
    <script>loadDOM('/partials/asideAdminPanel.html');</script>

    <br/>
    <div id="addItemPage" style="margin:80px 50px 0 300px">

        <form id="formSearch">

            <div class="relative z-0 w-full mb-5 mt-6 group">
                <input type="text" name="title" id="title" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " />
                <label for="title" class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Назва</label>
            </div>

            <div class="relative z-0 w-full mb-5 mt-6 group">
                <input type="text" name="priority" id="priority" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " />
                <label for="priority" class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Пріорітет</label>
            </div>

            <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Шукати</button>
        </form>

        <div class="relative overflow-x-auto shadow-md sm:rounded-lg mt-6">

            <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                    <tr>
                        <th scope="col" class="px-16 py-3">
                            <span class="sr-only">Фото</span>
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Нзва
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Slug
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Пріорітет
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody id="listCategories">
                    <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <td class="p-4">
                            <img src="https://flowbite.com/docs/images/products/apple-watch.png" class="w-16 md:w-32 max-w-full max-h-full" alt="Apple Watch">
                        </td>
                        <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                            Apple Watch
                        </td>
                        <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                            sdfasfasf
                        </td>

                        <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                            1
                        </td>
                        <td class="px-6 py-4">
                            <a href="#" class="font-medium text-red-600 dark:text-red-500 hover:underline">Remove</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav aria-label="Page navigation example" class="my-4 flex justify-center">
            <ul class="inline-flex -space-x-px text-base h-10" id="pagination">
            </ul>
        </nav>

    </div>

    <script>

        let search = {
            page: 1,
            //title: 'а'
        };

        document.addEventListener("DOMContentLoaded", function () {

            //Отримуємо дані з url, бо тут воно сидить
            let searchParams = {
                page: new URLSearchParams(window.location.search).get('page') || 1,
                title: new URLSearchParams(window.location.search).get('title') || '',
                priority: new URLSearchParams(window.location.search).get('priority') || '',
            };

            document.getElementById('title').value = searchParams.title;
            document.getElementById('priority').value = searchParams.priority;

            search = {
                ...search, ...searchParams
            };

            fetchCategories();

            console.log("DOM завантажений, але ресурси (зображення, стилі) можуть ще вантажитися.");
        });



        const formSearch = document.getElementById('formSearch');
        formSearch.addEventListener('submit', (event) => {
            event.preventDefault();

            const formData = new FormData(formSearch);
            const values = {};

            for (const [name, value] of formData.entries()) {
                values[name] = value;
            }

            search = {...search, ...values, page: 1};

            // Фільтруємо об'єкт, виключаючи порожні значення
            search = Object.fromEntries(
                Object.entries(search).filter(([_, value]) => value !== null && value !== undefined && value !== "")
            );
            history.pushState(null, null, `?${Qs.stringify(search)}`);

            fetchCategories();
        });

        async function fetchCategories() {
            try {
                
                const query = Qs.stringify(search);
                const response = await axios.get(`https://goose.itstep.click/api/Categories/search?${query}`, {
                    headers: {
                        'Accept': '*/*'
                    }
                });

                const { data } = response;
                console.log("server result", data);
                const { categories, pages, total, currentPage } = data;
                loadPagination(pages, currentPage);
                const listCategories = document.getElementById("listCategories");
                listCategories.innerHTML = "";
                categories.forEach(item => {
                    //console.log("item", item);
                    listCategories.innerHTML += `
                            <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
                                <td class="p-4">
                                    <img src="https://goose.itstep.click/images/200_${item.image}" class="" alt="Apple Watch">
                                </td>
                                <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                                    ${item.title}
                                </td>
                                <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                                    ${item.urlSlug}
                                </td>
                            
                                <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                                    ${item.priority}
                                </td>
                                <td class="px-6 py-4">
                                    <a href="categories/editCategory.html?id=${item.id}" class="font-medium text-green-600 dark:text-green-500 hover:underline">
                                        <i class="fa fa-3x fa-pencil-square-o" aria-hidden="true"></i>
                                    </a> 
                                    <a href="#" data-delete="${item.id}" data-delete-name="${item.title}" class="font-medium text-red-600 dark:text-red-500 hover:underline">
                                        <i class="fa fa-3x fa-times" aria-hidden="true"></i>
                                    </a>
                                </td>
                            </tr>
                    `;
                });


                window.scrollTo(0, 0);

                deleteDataItem();

                searchDataPage();

                //console.log("Server Result", data);
            } catch (error) {
                console.error('Error fetching categories:', error);
            }
        }


        function deleteDataItem() {
            document.querySelectorAll('[data-delete]').forEach(element => {
                element.addEventListener('click', event => {
                    event.preventDefault(); // Запобігаємо переходу за посиланням
                    console.log("event.target", event.target);
                    const link = event.target.closest('a[data-delete]'); 
                    const deleteId = link.getAttribute('data-delete'); // Отримуємо значення data-page
                    const deleteName = link.getAttribute('data-delete-name'); // Отримуємо значення data-page
                    console.log('Delete By Id:', deleteId, deleteName);
                });
            });
        }
        

        function searchDataPage()
        {
            document.querySelectorAll('[data-page]').forEach(element => {
                element.addEventListener('click', event => {
                    event.preventDefault(); // Запобігаємо переходу за посиланням
                    const page = event.target.getAttribute('data-page'); // Отримуємо значення data-page
                    search.page = page;
                    fetchCategories();
                    console.log('Вибрано сторінку:', page);
                });
            });
        }

        function loadPagination(pages, currentPage) {
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = `
                <li>
                        <a href="#" data-page="${1}" class="flex items-center justify-center px-4 h-10 ms-0 leading-tight text-gray-500 bg-white border border-e-0 border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">Previous</a>
                </li>
                `;

            for (let i = 1; i <= pages; i++) {
                if (i == currentPage)
                {
                    pagination.innerHTML += `
                    <li>
                        <a href="#" data-page="${i}" aria-current="page" class="flex items-center justify-center px-4 h-10 text-blue-600 border border-gray-300 bg-blue-50 hover:bg-blue-100 hover:text-blue-700 dark:border-gray-700 dark:bg-gray-700 dark:text-white">${i}</a>
                    </li>
                    `;

                }
                else {
                    pagination.innerHTML += `
                    <li>
                        <a href="#" data-page="${i}" class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">${i}</a>
                    </li>
                    `;
                }
            }

            pagination.innerHTML += `
                <li>
                    <a href="#" data-page="${pages}" class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">Next</a>
                </li>
                    `;
        }

    </script>
</body>
</html>
