
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tiny.cloud/1/l4ipj5d2e673xkfnuw4xjsxgaqqu4f45uf8qoh4az9o28mzr/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>
    <script src="/js/axios.min.js"></script>
    <link href="/css/style.css" rel="stylesheet" />
    <title></title>
</head>
<body>
    <script src="/js/site.js"></script>

    <script>loadDOM('/partials/header.html');</script>
    <br />
    <div id="addCategoryPage" class="">
        <div class="relative bg-white rounded-lg shadow-sm">

            <div class="flex items-center justify-center min-h-screen bg-gray-100 py-10">
                <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-4xl animate-fade-in-up">
                    <h2 class="text-3xl font-bold text-center text-[#0db865] mb-6">Create Product</h2>
                    <form class="grid grid-cols-2 gap-6" id="createProductForm">
                        <div class="col-span-2">
                            <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
                            <input id="title" type="text" placeholder="Enter product title" class="p-3 border rounded-lg focus:ring-2 focus:ring-[#0db865] w-full">
                        </div>

                        <div>
                            <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                            <select id="category" class="p-3 border rounded-lg focus:ring-2 focus:ring-[#0db865] w-full">
                                <option value="0">Оберіть категорію</option>
                            </select>
                        </div>

                        <div>
                            <label for="price" class="block text-sm font-medium text-gray-700">Price</label>
                            <input id="price" type="number" step="0.01" placeholder="Enter price" class="p-3 border rounded-lg focus:ring-2 focus:ring-[#0db865] w-full">
                        </div>

                        <div class="col-span-2">
                            <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                            <textarea id="description"
                                      placeholder="Describe your product"
                                      class="p-3 border rounded-lg focus:ring-2 focus:ring-[#0db865] w-full h-32">

                                Welcome to TinyMCE!
                            </textarea>
                        </div>

                        <div class="col-span-2 border-2 border-dashed border-[#0db865] rounded-xl p-6 text-center cursor-pointer relative">
                            <input type="file" onchange="openModalWindow(event)" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" id="fileInput">
                            <span class="text-gray-500">Drag or select photos</span>
                        </div>

                        <div class="col-span-2">
                            <button type="submit" class="w-full bg-[#0db865] hover:bg-[#0aa650] text-white py-3 rounded-lg transition-all duration-300">
                                Додати продукт
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        tinymce.init({
            selector: '#description',

            plugins: [
                'advlist', 'autolink', 'link', 'image', 'lists', 'charmap', 'preview', 'anchor', 'pagebreak',
                'searchreplace', 'wordcount', 'visualblocks', 'visualchars', 'code', 'fullscreen', 'insertdatetime',
                'media', 'table', 'emoticons', 'help'
            ],
            toolbar: 'undo redo | styles | bold italic | alignleft aligncenter alignright alignjustify | ' +
                'bullist numlist outdent indent | link image | print preview media fullscreen | ' +
                'forecolor backcolor emoticons | help',
            menu: {
                favs: { title: 'My Favorites', items: 'code visualaid | searchreplace | emoticons' }
            },
            menubar: 'favs file edit view insert format tools table help',

            
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            console.log("Load Dom");
            try
            {
                var list = await axios.get("https://goose.itstep.click/api/Categories/list");
                const { data } = list;

                // Отримуємо елемент select
                const selectElement = document.getElementById('category');

                // Для кожної категорії додаємо опцію в селект
                data.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id; // Значення опції - id категорії
                    option.textContent = category.title; // Текст опції - назва категорії
                    selectElement.appendChild(option); // Додаємо опцію до select
                });
                console.log("list categories", list);
            }
            catch (error) {
                console.error("error load category", error);
            }
        });
    </script>

    <script>
        var createProductForm = document.getElementById("createProductForm");
        createProductForm.addEventListener("submit", (e) => {
            e.preventDefault();
            //console.log("Working submit form");
            // Отримуємо елемент select
            const categoryId = document.getElementById('category').value;
            var description = tinymce.activeEditor.getContent();

            var request = {
                categoryId,
                description
            };

            console.log("Send Data server", request);

        });
    </script>


</body>

</html>
